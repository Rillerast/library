<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="javascript.js" defer></script>
    <title>Library</title>
</head>
<body>
    <table>
        <colgroup>
            <col class="column-border">
            <col class="column-border">
            <col class="column-border">
            <col class="column-border">
            <col class="column-border">
            <col class="column-border">
        </colgroup>
        <thead>
            <tr>
                <th scope="col">Author</th>
                <th scope="col">Title</th>
                <th scope="col">Pages</th>
                <th scope="col">Readed</th>
                <th scope="col">ID</th>
                <th scope="col">Delete</th>
            </tr>
        </thead>
        <tbody>

        </tbody>
    </table>
    <button class="add-form-button">Add new book</button>
    <div class="new-book-form hidden">
        <div class="form-container">
            <form action="#" method="post" id="form">
                <h2>Write the new book's data.</h2>
                <label for="author">Author</label>
                <input type="text" id="author" name="author">
                <label for="title">Title</label>
                <input type="text" id="title" name="title">
                <label for="pages">Pages</label>
                <input type="number" id="pages" name="pages">
                <label for="readed">Readed</label>
                <input type="text" id="readed" name="readed">
            </form>
            <div class="buttons">
                <button type="reset" form="form">Reset fields</button>
                <button type="submit" form="form">Submit</button>
                <button class="cancel-form-button">Cancel</button>
            </div>
        </div>
    </div>
</body>
</html>
